name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run calculation, persistence, and HTTP tests
        run: python -m unittest discover -s tests -v
      - name: Check the documented example
        run: python examples/demo_round.py --check
      - name: Check source packaging
        run: python tools/build_release.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check dashboard rendering
        run: node tests/test_dashboard.cjs
      - name: Check decision form rendering
        run: node tests/test_market.cjs
